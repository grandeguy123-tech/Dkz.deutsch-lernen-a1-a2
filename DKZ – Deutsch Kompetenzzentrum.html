<title>DKZ – Deutsch Kompetenzzentrum | Apprends Deutsch Easy</title>
<meta name="description" content="Guides PDF et livres imprimés pour apprendre l’allemand (A1 à B2) et préparer TELC, Goethe, ÖSD, ECL.">

<style>
:root{--bg:#F6F7FB;--surface:#fff;--ink:#0F1B3D;--muted:#51608A;--line:#DDE2F0;--red:#C8102E;--gold:#F2B705;--hero:#0F1B3D;--on-red:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1126;--surface:#141C3A;--ink:#EEF1FB;--muted:#9AA6CC;--line:#26305A;--red:#FF4D63;--hero:#141C3A;--on-red:#0B1126}}
:root[data-theme="dark"]{--bg:#0B1126;--surface:#141C3A;--ink:#EEF1FB;--muted:#9AA6CC;--line:#26305A;--red:#FF4D63;--hero:#141C3A;--on-red:#0B1126}
body.ex{--hero:#3B1473;--red:#7C3AED}
@media (prefers-color-scheme:dark){body.ex{--hero:#2A1056;--red:#A78BFA;--on-red:#1E0B3A}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.55;font-size:17px}
.wrap{max-width:960px;margin:0 auto;padding:0 20px}
.hero{background:var(--hero);color:#fff;border-bottom:6px solid var(--gold);padding:18px 0 38px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:800}
.top small{display:block;font-weight:400;color:#C9D1EE;font-size:13px}
.sw button{background:none;border:1px solid #C9D1EE;color:#fff;padding:5px 11px;border-radius:8px;font:inherit;font-size:14px;cursor:pointer}
.sw button.on{background:var(--gold);color:#0F1B3D;border-color:var(--gold);font-weight:600}
h1{font-size:clamp(36px,9vw,66px);line-height:1.03;margin:28px 0 8px;letter-spacing:-.02em;font-weight:800}
.hero p{color:#E4E8F8;margin:0;max-width:36em}
h2{font-size:clamp(24px,5vw,33px);margin:0 0 8px;line-height:1.15}
.lead{color:var(--muted);margin:0 0 20px;max-width:38em}
main{padding:32px 0 10px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:9px;text-align:left;color:inherit;font:inherit}
.card h3{margin:0;font-size:19px;line-height:1.2}
.card p{margin:0;color:var(--muted);flex:1}
.bk{height:118px;border-radius:6px 12px 12px 6px;background:linear-gradient(135deg,var(--c),#0F1B3D);color:#fff;padding:12px 12px 12px 20px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;box-shadow:inset 9px 0 0 rgba(0,0,0,.25),0 8px 16px rgba(15,27,61,.22);position:relative}
.bk b{font-size:36px;line-height:1}.bk i{font-style:normal;font-weight:600;font-size:15px;line-height:1.2}
.pdf{position:absolute;right:10px;top:10px;background:var(--gold);color:#0F1B3D;font-weight:800;font-size:12px;padding:2px 8px;border-radius:6px}
.cv{aspect-ratio:3/4;width:100%;max-width:190px;margin:0 auto;border-radius:6px 12px 12px 6px;background:linear-gradient(160deg,var(--c),#0F1B3D);color:#fff;padding:14px 14px 0 24px;display:flex;flex-direction:column;box-shadow:inset 10px 0 0 rgba(0,0,0,.28),0 10px 22px rgba(15,27,61,.28);overflow:hidden}
.cv small{font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;opacity:.85}
.cl{align-self:flex-start;margin:10px 0;background:var(--gold);color:#0F1B3D;font-weight:800;font-size:22px;padding:2px 12px;border-radius:8px}
.cv b{font-size:18px;line-height:1.15;display:block}
.cv i{font-style:normal;font-size:12.5px;opacity:.92;margin-top:6px}
.fl{margin:auto -14px 0 -24px;height:20px;background:linear-gradient(#111 0 33.3%,#DD0000 33.3% 66.6%,#FFCE00 66.6%)}
.lvl{cursor:pointer}.lvl:hover{border-color:var(--red)}
.exc{background:linear-gradient(135deg,#4C1D95,#7C3AED);border:0;color:#fff;width:100%;margin-top:14px}.exc p{color:#E9D5FF}
.price{font-weight:800;font-size:20px}.price small{font-weight:400;color:var(--muted);font-size:14px}
.btn{display:inline-block;background:var(--red);color:var(--on-red);font-weight:600;text-decoration:none;text-align:center;padding:12px 20px;border-radius:10px;border:0;font:inherit;font-weight:600;cursor:pointer}
.btn.alt{background:none;border:2px solid var(--red);color:var(--red)}
.back{background:none;border:0;color:var(--muted);font:inherit;cursor:pointer;padding:0 0 14px}
.btn:focus-visible,.back:focus-visible,.lvl:focus-visible,.sw button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.langs{display:grid;gap:14px;grid-template-columns:1fr 1fr;margin-top:30px;max-width:460px}.langs .btn{font-size:20px;padding:18px}
.sec{margin-top:34px}
.pc{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:start}
.pc img{width:120px;border-radius:8px;box-shadow:0 8px 18px rgba(0,0,0,.28)}.pc>div{display:flex;flex-direction:column;gap:8px}
.info{margin:0 0 16px;padding-left:20px;color:var(--muted)}.info li{margin-bottom:4px}
.exsec{margin-top:30px;padding-top:18px;border-top:5px solid var(--red)}
.note{background:var(--surface);border-left:4px solid var(--gold);padding:10px 14px;border-radius:0 10px 10px 0;color:var(--muted);font-size:15px;margin:0 0 6px}
ol.steps{list-style:none;counter-reset:s;margin:0;padding:0;display:grid;gap:12px}
ol.steps li{counter-increment:s;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 14px 14px 56px;position:relative}
ol.steps li::before{content:counter(s);position:absolute;left:14px;top:12px;width:30px;height:30px;border-radius:50%;background:var(--red);color:var(--on-red);font-weight:800;display:grid;place-items:center}
ol.steps b{display:block}ol.steps span{color:var(--muted)}
input,textarea,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit;margin-bottom:10px}
label{font-weight:600;display:block;margin-bottom:6px}
.sw2{display:flex;gap:8px;margin-bottom:10px}.sw2 button{flex:1;padding:11px;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;cursor:pointer}.sw2 button.on{border-color:var(--red);font-weight:600}
.big{background:var(--hero);color:#fff;border-radius:12px;padding:14px;font-size:26px;font-weight:800;border-bottom:5px solid var(--gold)}
.err{color:var(--red);font-weight:600;min-height:24px}
footer{border-top:1px solid var(--line);margin-top:40px;padding:26px 0 40px;color:var(--muted);font-size:15px}
</style>

li:{A1:["Présent, articles et genres, négation, questions simples, verbes modaux de base.","Environ 600 à 700 mots : se présenter, famille, nombres, courses, heure.","Se présenter, saluer, demander son chemin, commander, remercier.","Vous partez de zéro ? À la fin du niveau A1, vous comprenez et dites l’essentiel du quotidien."],

{n:"ECL",c:"#4338CA",i:["Quatre compétences notées sur 25 points chacune (100 au total). Lesen et Hören : 20 questions, 1,25 point par bonne réponse. Schreiben et Sprechen : notés par deux examinateurs sur 5 critères.","Aucun exercice de grammaire ni de traduction : l’examen teste l’usage réel de la langue.","Réussite (examens depuis août 2026) : au moins 60 % dans chaque module. Avant : 40 % minimum par compétence et 60 % de moyenne. Les modules réussis donnent un certificat, même si les autres sont échoués (règle publiée par le centre ECL de Hongrie)."],b:{B1:["Lesen : 35 min, 500 à 700 mots.","Schreiben : 40 min, 2 textes d’environ 100 mots chacun, à partir de 4 points.","Hören : 20 à 25 min, 2 enregistrements écoutés deux fois.","Sprechen : en binôme, environ 18 à 20 min : échauffement, conversation guidée, puis monologue sur 4 images."],B2:["Lesen : 45 min, 800 à 1 000 mots.","Schreiben : 60 min, 2 textes d’environ 150 mots chacun (commentaire, rapport, email ou essai).","Hören : 25 à 30 min, 800 à 1 000 mots, avec un court exposé possible.","Sprechen : en binôme, environ 18 à 20 min, même structure qu’à B1 avec des thèmes plus complexes."]},it:["doc","swx","th","di"]}];

  h+='<button class="back" onclick="go(PV,LV)">'+t.back+'</button><h2>'+p.title+'</h2><div class="card"><p><b>'+p.item+' :</b> '+a.n+'</p><p><b>'+(ph?p.total:p.amount)+' :</b> '+tot+'</p></div><div class="sec"><label>'+p.num+'</label><div class="big">'+PHONE+'</div>'+(MERCHANT_CODE?'<label style="margin-top:12px">'+p.code+'</label><div class="big">'+MERCHANT_CODE+'</div>':'')+'</div><div class="sec">'+f+'</div><div class="sec"><h2>'+p.how+'</h2><ol class="steps">'+p.s.map(function(s){return '<li><span>'+s+'</span></li>'}).join("")+'</ol></div><p class="err" id="err" style="margin-top:16px"></p><a class="btn" target="_blank" rel="noopener" href="#" onclick="return prep(this)">'+p.send+'</a><p class="lead" style="margin-top:14px">'+p.alt+'<a href="mailto:'+EMAIL+'">'+EMAIL+'</a>.<br>'+p.pin+'</p>';
 }
 h+='</div></main>'+foot();
 app.innerHTML=h;
}
render();
</script>
</body>
</html>
